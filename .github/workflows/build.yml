name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🛠️ Install Expo CLI
        run: npm install -g eas-cli expo-cli

      - name: 🏗️ Prebuild Android Project
        env:
          CI: 1
          NODE_ENV: production
        run: npx expo prebuild --platform android

      - name: 🔑 Configure Release Signing Key
        run: |
          cd android/app
          keytool -genkeypair -v -keystore release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=FleetApp, OU=Dev, O=Fleet, L=Taiz, S=Taiz, C=YE"
          sed -i '/signingConfigs {/a \        release {\n            storeFile file("release.keystore")\n            storePassword "android"\n            keyAlias "releasekey"\n            keyPassword "android"\n        }' build.gradle
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' build.gradle

      - name: 🤖 Build Signed Release APK
        env:
          NODE_ENV: production
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.parallel=false

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetApp-v1.2.4-Build40
          path: android/app/build/outputs/apk/release/app-release.apk
